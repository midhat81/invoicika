services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "4444:4200"
    volumes:
      - ./Frontend/src:/app/src
    depends_on:
      - backend

  backend:
    build:
      context: ./WebAPI
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=invoicikaDb;Username=postgres;Password=invoicika!123;SSL Mode=Disable
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./WebAPI:/app/webapi
    networks:
      - invoicika_backend

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=invoicikaDb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=invoicika!123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - invoicika_backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invoicikaDb"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

networks:
  invoicika_backend:

volumes:
  postgres_data:
